name: Verify contact journey layout

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "assets/agency-v2.css"
      - "scripts/verify-agency-layout.mjs"
      - "assets/contact-journey.css"
      - "scripts/verify-contact-journey.mjs"
      - ".github/workflows/verify-contact-journey.yml"

permissions:
  contents: read

jobs:
  contact-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start static portfolio
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 > /tmp/contact-server.log 2>&1 &
          sleep 2
      - name: Check agency contact layout
        run: node scripts/verify-contact-journey.mjs
