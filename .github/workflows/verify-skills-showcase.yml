name: Verify skills showcase

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "assets/agency-v2.css"
      - "scripts/verify-agency-layout.mjs"
      - "assets/skills-showcase.css"
      - "assets/skills-showcase.js"
      - "scripts/verify-skills-showcase.mjs"
      - ".github/workflows/verify-skills-showcase.yml"

permissions:
  contents: read

jobs:
  skills-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start portfolio
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 > /tmp/skills-site.log 2>&1 &
          sleep 2
      - name: Check agency skill grid across screen sizes
        run: node scripts/verify-skills-showcase.mjs
