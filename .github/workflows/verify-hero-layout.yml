name: Verify responsive hero layout

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "assets/agency-v2.css"
      - "scripts/verify-agency-layout.mjs"
      - "assets/hero-fluid.css"
      - "assets/hero-cinematic.css"
      - "scripts/verify-hero-layout.mjs"
      - ".github/workflows/verify-hero-layout.yml"

permissions:
  contents: read

jobs:
  hero-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium testing dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start static portfolio
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 > /tmp/portfolio-hero.log 2>&1 &
          sleep 2
      - name: Test agency hero and navigation at seven viewport sizes
        run: node scripts/verify-hero-layout.mjs
