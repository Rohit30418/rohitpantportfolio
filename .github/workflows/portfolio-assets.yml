name: Build portfolio static assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-assets.yml'
      - '.github/create-portfolio-assets.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-only image and PDF tooling
        run: python -m pip install --disable-pip-version-check pillow reportlab
      - name: Create resume and social preview
        run: python .github/create-portfolio-assets.py
      - name: Commit generated assets
        shell: bash
        run: |
          git add assets/Rohit-Pant-Resume.pdf assets/og-image.jpg
          if git diff --cached --quiet; then
            echo "Assets already up to date"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add resume PDF and Open Graph image"
            git push origin HEAD:main
          fi
