    <linearGradient id="headphone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454053"/><stop offset="1" stop-color="#171720"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#39354c" flood-opacity=".12"/></filter>
  </defs>
