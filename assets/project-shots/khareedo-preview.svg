    <rect x="308" y="580" width="244" height="72" rx="17" fill="#dbece8"/><text x="327" y="605" fill="#4b7870" font-weight="700" font-size="12">02 / PHONES</text><text x="327" y="632" fill="#2b2839" font-weight="800" font-size="19">Stay connected ↗</text>
