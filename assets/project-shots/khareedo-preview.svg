<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Khareedo interface illustration</title>
  <desc id="desc">A conceptual representation of the implemented Khareedo storefront with category navigation, an editorial hero and product cards. Not a captured browser screenshot.</desc>
  <defs>
